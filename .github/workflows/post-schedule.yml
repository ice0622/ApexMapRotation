name: Post Apex ranked map schedule

on:
  # JST 0:00 にその日のローテーションを1通投稿する。
  # 01:00 / 02:00 は GitHub Actions の schedule 遅延・欠落に対するリトライ。
  # 投稿済みかどうかはキャッシュに置いた記録で判定するので、全部走っても投稿は1日1回。
  schedule:
    - cron: '0 15,16,17 * * *'
  # 手動実行（テスト・オンデマンド投稿用）。
  workflow_dispatch:
    inputs:
      force:
        description: '本日投稿済みでも再投稿する'
        type: boolean
        default: false
      use_mock:
        description: 'ダミーデータを使う（APIキー無しで Discord 送信を確認）'
        type: boolean
        default: false
      dry_run:
        description: '送信せずログに文面だけ出す'
        type: boolean
        default: false

# state/rotation.json を push するために必要。
permissions:
  contents: write

# observe-rotation.yml と同じ state を書くので、同一グループで直列化する。
concurrency:
  group: rotation-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 実行時依存が無いため npm install は不要。

      # 「その日はもう投稿したか」の記録。毎日変わる値なのでコミットせずキャッシュに置く。
      # 失っても影響は「その日に最大3回投稿する」だけで、翌日には自然に戻る。
      - name: Restore posted marker
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: posted-marker-${{ github.run_id }}
          restore-keys: posted-marker-

      - name: Post schedule
        id: post
        env:
          APEX_API_KEY: ${{ secrets.APEX_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # schedule では inputs が null になるため既定値へフォールバック。
          USE_MOCK: ${{ inputs.use_mock && 'true' || '' }}
          FORCE: ${{ inputs.force && 'true' || '' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: node src/jobs/postSchedule.ts

      # 実際に投稿できた回だけ保存する。キーは重複できないので run_id で一意にし、
      # 復元は restore-keys の前方一致で最新のものを拾う。
      - name: Save posted marker
        if: steps.post.outputs.posted == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: posted-marker-${{ github.run_id }}

      # state/rotation.json はローテーションを学習したときしか変わらないので、
      # コミットはシーズンが変わったときなど年に数回だけになる。
      - name: Commit & push state if changed
        run: |
          if [ -n "$(git status --porcelain state/rotation.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/rotation.json
            git commit -m "chore(state): update ranked rotation [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "state に変更なし。コミットしません。"
          fi
