name: Post Apex ranked map schedule

on:
  # 毎時。JST 0:00（15:00 UTC）の回がその日のスケジュールを投稿し、
  # 以降の回は「投稿済み」の記録を読んで即終了する（API も叩かない）。
  # GitHub の schedule は宣言どおりに走らないので、毎時にしておけば
  # 取りこぼしても次の時間で取り返せる。
  # マップ構成が変わって並びを判別できない日だけ、枠が変わるたびに投稿し直す。
  schedule:
    - cron: '0 * * * *'
  # 手動実行（テスト・オンデマンド投稿用）。
  workflow_dispatch:
    inputs:
      force:
        description: '本日投稿済みでも再投稿する'
        type: boolean
        default: false
      use_mock:
        description: 'ダミーデータを使う（APIキー無しで Discord 送信を確認）'
        type: boolean
        default: false
      dry_run:
        description: '送信せずログに文面だけ出す'
        type: boolean
        default: false

# リポジトリへ書き込むものが無いので読み取りだけでよい。
permissions:
  contents: read

# 遅延で実行が重なったときに二重投稿しないよう直列化する。
concurrency:
  group: post-schedule
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 実行時依存が無いため npm install は不要。

      # 「その日に何をどこまで投稿したか」の記録。毎日変わる値なのでコミットせず
      # キャッシュに置く。失ってもその日にもう一度投稿する程度で自己修復する。
      - name: Restore posted marker
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: posted-marker-${{ github.run_id }}
          restore-keys: posted-marker-

      - name: Post schedule
        id: post
        env:
          APEX_API_KEY: ${{ secrets.APEX_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # schedule では inputs が null になるため既定値へフォールバック。
          USE_MOCK: ${{ inputs.use_mock && 'true' || '' }}
          FORCE: ${{ inputs.force && 'true' || '' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: node src/jobs/postSchedule.ts

      # 実際に投稿できた回だけ保存する。キーは重複できないので run_id で一意にし、
      # 復元は restore-keys の前方一致で最新のものを拾う。
      - name: Save posted marker
        if: steps.post.outputs.posted == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: posted-marker-${{ github.run_id }}
